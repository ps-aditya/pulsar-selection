<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3-minute video animatic (v0.2) — Project 7 Pulsar Candidate Selection</title>
<style>
:root{--bg:#0b1020;--card:#141b33;--ink:#e8ecf7;--mut:#9aa4c3;--acc:#7aa2ff;--ok:#4ade80;--warn:#fbbf24;--org:#e8833a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:clamp(15px,1.65vw,21px)/1.52 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#stage{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:3vh 5vw 1vh;position:relative}
.scene{display:none;text-align:center;max-width:68em;width:100%}
.scene.on{display:block}
.scene img{background:#fff;border-radius:12px;border:1px solid #2a3560;max-width:100%;max-height:48vh;display:block;margin:0 auto .8em}
.scene h1{font-size:2.3em;line-height:1.18;margin-bottom:.35em}
.scene h2{font-size:1.55em;color:var(--acc);margin-bottom:.45em}
.scene .card{background:var(--card);border:1px solid #232d55;border-radius:12px;padding:.9em 1.25em;margin:.45em auto;max-width:58em;text-align:left}
.scene .close{font-size:1.7em;color:var(--acc);font-weight:700}
.term{background:#0e1430;border:1px solid #2c3a6b;border-radius:10px;padding:.9em 1.2em;font:.68em/1.48 Consolas,Menlo,monospace;color:#c9e3ff;white-space:pre;text-align:left;max-height:46vh;overflow:auto;margin:0 auto;max-width:58em}
.term b{color:var(--ok)}
table{border-collapse:collapse;font-size:.82em;margin:.4em auto}
th,td{border:1px solid #2a3560;padding:.4em .85em;text-align:left}
th{background:#1a2342;color:var(--acc)}
#narr{background:#101731;border-top:2px solid var(--org);padding:.95em 7vw;font-size:1.02em;color:var(--ink);min-height:6.8em}
#narr .lab{color:var(--org);font-size:.7em;text-transform:uppercase;letter-spacing:.12em;display:block;margin-bottom:.25em;font-weight:700}
#barwrap{height:7px;background:#1a2342}
#bar{height:100%;width:0%;background:var(--org);transition:width .18s linear}
#hud{display:flex;justify-content:space-between;align-items:center;padding:.45em 1.2em;font-size:.8em;color:var(--mut);border-top:1px solid #232d55}
#hud button{background:#1d2748;color:var(--ink);border:1px solid #2c3a6b;border-radius:8px;padding:.3em .85em;cursor:pointer;font-size:.95em;margin-left:.35em}
#tc{font-family:Consolas,Menlo,monospace;color:var(--acc)}
</style>
</head>
<body>
<div id="stage"></div>
<div id="narr"><span class="lab" id="scenelab">Scene 1 / 9 · Narration</span><span id="narrtext"></span></div>
<div id="barwrap"><div id="bar"></div></div>
<div id="hud">
  <span>Project 7 · Aditya Shaji &amp; Atharav Gavankar · 180 s · Space = pause · ← → scene · R = restart</span>
  <span><span id="tc">0:00 / 3:00</span><button id="pp" onclick="toggle()">⏸</button><button onclick="jump(-1)">◀</button><button onclick="jump(1)">▶</button><button onclick="reset()">⟳</button></span>
</div>
<script>
const SCENES=[
{d:15,title:"1 · The 91% Accuracy Trap",
 html:`<h1>Finding Pulsars in a Haystack of Noise</h1><div class="card" style="text-align:center"><b style="font-size:1.35em;color:var(--org)">90.84% accuracy — 0 pulsars found.</b><br><span style="color:var(--mut)">Team: Aditya Shaji · Atharav Gavankar &nbsp;|&nbsp; Project 7: Astrophysics (HTRU2) &nbsp;|&nbsp; Guide: Prof. Dr. Rabinder Henry</span></div>`,
 n:"A model that says 'not a pulsar' for every candidate scores ninety-one percent accuracy and finds nothing. So on this project accuracy is the wrong score. The question is what the model rejects, and how sure it is."},
{d:13,title:"2 · The Data: HTRU2 (17,898 candidates)",
 html:`<h2>HTRU2 — 17,898 human-vetted radio candidates (9.16% pulsars)</h2><img src="assets/balance.png" alt="balance"><img src="assets/corr8.png" alt="corr8" style="display:none">`,
 n:"The data is HTRU2: seventeen thousand eight hundred ninety-eight radio candidates from the Parkes Observatory. Nine point one six percent are real pulsars. Each candidate is eight numbers: four describe its folded pulse profile, four describe its dispersion curve."},
{d:22,title:"3 · Fair Testing: Split First & Leakage Audit",
 html:`<h2>Stratified 60/20/20 split BEFORE any weighting (§6b code audit)</h2><div class="term">exact duplicate rows overall: <b>0</b>
duplicates train↔val: <b>0</b>   train↔test: <b>0</b>   val↔test: <b>0</b>
index disjointness: <b>OK (train/val/test pairwise disjoint)</b>
train: n=10738  pos=983  pos_rate=0.091544
val:   n= 3580  pos=328  pos_rate=0.091620
test:  n= 3580  pos=328  pos_rate=0.091620
scaler fit on train only: <b>OK (n_samples_seen_ = 10738 == train size)</b>
calibration fold disjoint from train and test: <b>OK</b></div>`,
 n:"We split first, stratified, before any reweighting, so near-copies cannot land on both sides. The code-printed audit verifies zero duplicate rows, disjoint index sets, and a scaler fit on training rows only. The test set is evaluated once, at the very end."},
{d:30,title:"4 · Four-Way Calibration Study (Repeated 5×2 CV)",
 html:`<h2>Calibration study — selected by cross-validated Brier on train+val</h2><img src="assets/reliability.png" alt="calibration">`,
 n:"Calibration: we tested four ways to make probabilities honest — none, sigmoid, isotonic, and cross-fitted sigmoid — under repeated cross-validated Brier on train plus validation. None beat the raw class-weighted forest, at zero point zero one seven two one, and isotonic hurt ranking. Test calibration error is zero point zero zero nine nine. The brief's target, a lower Brier after calibration, is not met, and we report that measured finding."},
{d:30,title:"5 · Cut-Off From an Explicit 10:1 Cost Model",
 html:`<h2>Written cost model (10·FN + 1·FP) → T = 0.54 (reconciled with 1/11 ≈ 0.091)</h2><img src="assets/cost_curve.png" alt="cost curve">`,
 n:"The threshold comes from a written cost model: a missed pulsar costs ten, a wasted follow-up costs one. Under the natural nine percent prior, the textbook rule gives zero point zero nine. Because our forest balances classes by nine point nine times inside each tree, that point shifts to zero point five zero, and the empirical cost minimum on train plus validation lands at zero point five four — zero missed pulsars at forty-two false alarms."},
{d:20,title:"6 · Learning Curve: How Many Labels Are Needed?",
 html:`<h2>Learning curve — 3-fold CV PR-AUC inside train (up to 7,159 labels)</h2><img src="assets/learning_curve.png" alt="learning curve">`,
 n:"How many labels are needed? Cross-validated PR-AUC rises to about zero point nine two by around five and a half thousand labels, then flattens. That is within the range we tested, up to seven thousand one hundred fifty-nine labels, or two-thirds of the training set."},
{d:20,title:"7 · Astrophysical Interpretation: Permutation Importance",
 html:`<h2>Permutation importance on validation — pulse shape dominates by 17×</h2><img src="assets/importance.png" alt="importance">`,
 n:"What does the model listen to? Profile kurtosis — how sharply the pulse peaks — by a factor of seventeen over anything else. A real pulsar is a sharp repeating lighthouse blink. Interference folds flat. The dispersion statistics refine the decision without carrying it."},
{d:20,title:"8 · Single Final Test Evaluation & Error Analysis",
 html:`<h2>Final test evaluation (single pass, B=2000 bootstrap CIs)</h2>
<table><tr><th>Metric</th><th>Point Estimate</th><th>95% CI</th><th>Status</th></tr>
<tr><td>ROC-AUC</td><td style="color:var(--ok)"><b>0.9777</b></td><td>0.9671 – 0.9872</td><td style="color:var(--ok)">✓ Met (≥ 0.97)</td></tr>
<tr><td>PR-AUC</td><td><b>0.9332</b></td><td>0.9117 – 0.9542</td><td>Primary ranking</td></tr>
<tr><td>Precision @ T=0.54</td><td><b>0.9183</b></td><td>0.8889 – 0.9461</td><td style="color:var(--ok)">✓ ≥ 0.90</td></tr>
<tr><td>Recall @ T=0.54</td><td style="color:var(--warn)"><b>0.8567</b></td><td>0.8201 – 0.8933</td><td style="color:var(--warn)">✗ Target ≥ 0.90</td></tr>
<tr><td>Brier / ECE</td><td><b>0.0166 / 0.0099</b></td><td>0.0135 – 0.0199</td><td style="color:var(--warn)">ΔBrier = 0 (none won)</td></tr></table>`,
 n:"Final test, one pass, with bootstrap intervals. ROC-AUC is zero point nine seven seven seven, which meets the target. Recall is zero point eight five seven at precision zero point nine one eight, missing the ninety percent recall target. And the missed pulsars have median scores near zero point one — confidently wrong, so moving the threshold cannot recover them."},
{d:10,title:"9 · Conclusion",
 html:`<div class="close">"The score was easy.<br>The real work is calibration, the cost model, and the misses no threshold can fix."</div><div class="card" style="text-align:center;margin-top:1em">github.com/ps-aditya/pulsar-selection · Reproducible in one command (SEED = 42)</div>`,
 n:"The score was easy. The real work is calibration, the cost model, and the misses we cannot fix with a threshold."}];

const stage=document.getElementById('stage'),narrT=document.getElementById('narrtext'),sceneL=document.getElementById('scenelab'),
      bar=document.getElementById('bar'),tc=document.getElementById('tc'),pp=document.getElementById('pp'),vb=document.getElementById('vb');
SCENES.forEach((s,i)=>{const d=document.createElement('div');d.className='scene';d.id='sc'+i;d.innerHTML=s.html;stage.appendChild(d);});
let elapsed=0,timer=null,lastWall=null,voiceOn=false,lastSpoken=-1;
const TOTAL=SCENES.reduce((a,s)=>a+s.d,0);
function starts(){let a=0;SCENES.forEach((s)=>{s.t0=a;s.t1=a+s.d;a+=s.d;});}
starts();
function fmt(x){return Math.floor(x/60)+":"+String(Math.floor(x%60)).padStart(2,'0');}
function sceneAt(t){for(let i=0;i<SCENES.length;i++)if(t<SCENES[i].t1)return i;return SCENES.length-1;}
function speakScene(s){
 if(!voiceOn||!('speechSynthesis' in window))return;
 if(lastSpoken===s)return;
 lastSpoken=s;
 window.speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(SCENES[s].n);
 u.rate=1.02;
 window.speechSynthesis.speak(u);
}
function render(){
 let s=sceneAt(elapsed);
 SCENES.forEach((sc,i)=>document.getElementById('sc'+i).classList.toggle('on',i===s));
 sceneL.textContent=`Scene ${s+1} / ${SCENES.length} · ${SCENES[s].title}`;
 narrT.textContent=SCENES[s].n;
 bar.style.width=(elapsed/TOTAL*100)+"%";
 tc.textContent=fmt(elapsed)+" / "+fmt(TOTAL);
 speakScene(s);
}
function startLoop(){ if(timer)return; lastWall=Date.now(); timer=setInterval(()=>{
 const now=Date.now(); elapsed=Math.min(TOTAL,elapsed+(now-lastWall)/1000); lastWall=now;
 render(); if(elapsed>=TOTAL)stopLoop();
},200); }
function stopLoop(){ if(timer){clearInterval(timer);timer=null;} }
function toggle(){ if(timer){stopLoop();pp.textContent='▶';if('speechSynthesis' in window)window.speechSynthesis.cancel();}else{lastSpoken=-1;startLoop();pp.textContent='⏸';} }
function toggleVoice(){
 voiceOn=!voiceOn;
 vb.textContent=voiceOn?'🔊 Voice ON':'🔊 Voice';
 if(!voiceOn&&('speechSynthesis' in window))window.speechSynthesis.cancel();
 else{lastSpoken=-1;speakScene(sceneAt(elapsed));}
}
function jump(d){
 stopLoop();
 let s=sceneAt(elapsed);
 elapsed=(d>0)?Math.min(SCENES[s].t1+0.01,TOTAL-0.01):Math.max(SCENES[Math.max(0,s-1)].t0,0);
 lastSpoken=-1; render(); startLoop();
}
function reset(){ stopLoop(); elapsed=0; lastSpoken=-1; render(); startLoop(); }
document.addEventListener('keydown',e=>{
 if(e.key===' '){e.preventDefault();toggle();}
 else if(e.key==='ArrowRight')jump(1);else if(e.key==='ArrowLeft')jump(-1);
 else if(e.key.toLowerCase()==='r')reset();
});
render();startLoop();
</script>
</body>
</html>
